version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: openex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: openex
      POSTGRES_USER: openex
      POSTGRES_PASSWORD: openex
    ports:
      - "5432:5432"
    volumes:
      - openex-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openex -d openex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  openex-pgdata:
