spring:
  application:
    name: openex-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/openex}
    username: ${DB_USER:openex}
    password: ${DB_PASSWORD:openex}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate auto-DDL
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

app:
  symbol: ${SYMBOL:BTC-USD}
  base-asset: ${BASE_ASSET:BTC}
  quote-asset: ${QUOTE_ASSET:USD}
  seed-data: ${SEED_DATA:false}

logging:
  level:
    com.openex: INFO
